<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Dashboard</title>
    <style>
        /* टेबलला भारी लुक देण्यासाठी CSS */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; }
        h2 { text-align: center; color: #333; }
        table { width: 80%; margin: 20px auto; border-collapse: collapse; background: white; box-shadow: 0px 4px 8px rgba(0,0,0,0.1); }
        th, td { padding: 12px 15px; text-align: center; border-bottom: 1px solid #ddd; }
        th { background-color: #28a745; color: white; text-transform: uppercase; }
        tr:hover { background-color: #f1f1f1; }
    </style>
</head>
<body>

    <h2>📦 AI Agri-Bot: Product Inventory</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Product Name</th>
                <th>Category</th>
                <th>Quantity</th>
                <th>Price (₹)</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>

    <script>
        // 🚀 JavaScript चं Fetch API: हे Java च्या 8080 पोर्टवरून डेटा आणेल
        fetch('http://localhost:8080/api/products')
            .then(response => response.json()) // आलेल्या डेटाला JSON मध्ये कन्व्हर्ट करणे
            .then(data => {
                let tableContent = ""; // एक रिकामी स्ट्रिंग घेतली
                
                // डेटाबेसमधील प्रत्येक प्रॉडक्टसाठी एक 'Row' (tr) बनवणे
                data.forEach(product => {
                    tableContent += `
                        <tr>
                            <td>${product.id}</td>
                            <td><strong>${product.name}</strong></td>
                            <td>${product.category}</td>
                            <td>${product.quantity}</td>
                            <td style="color: green; font-weight: bold;">₹${product.price}</td>
                        </tr>
                    `;
                });

                // तो तयार केलेला HTML चा डेटा 'tbody' मध्ये टाकणे
                document.getElementById("tableBody").innerHTML = tableContent;
            })
            .catch(error => {
                console.error("Error fetching data:", error);
                document.getElementById("tableBody").innerHTML = "<tr><td colspan='5' style='color:red;'>Backend API is not running!</td></tr>";
            });
    </script>

</body>
</html>
